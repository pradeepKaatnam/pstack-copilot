name: Preservation and compatibility coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned archive, complete audit, and discovery boundaries
        run: python3 scripts/verify.py
      - name: Test preservation and installation safeguards
        run: python3 -m unittest discover -s tests -v
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install preserved runtime dependencies without lifecycle scripts
        working-directory: copilot/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run preserved runtime tests and typecheck
        working-directory: copilot/skills/poteto-mode/scripts
        run: |
          bun run test
          bun run typecheck
